# netcut profile: Discord desktop client
#
# proc_match   substring matched against full argv to find the app's processes.
#              Discord's Electron network helper owns every socket, so matching
#              the bundle path catches it along with the main process.
# hold_domains resolved at cut time; these are the endpoints the client would
#              reconnect to during the cut window.
# hold_cidrs   the enumerated Discord/Cloudflare endpoint set, so a DNS answer
#              outside the live rotation still lands on a blocked address.
# Voice media servers are not listed: they are handed out per call, and the
# live-socket layer blocks whichever one is actually connected at cut time.

proc_match = /Applications/Discord.app
hold_domains = discord.com gateway.discord.gg cdn.discordapp.com media.discordapp.net latency.discord.media remote-auth-gateway.discord.gg
hold_cidrs = 162.159.128.232 162.159.128.233 162.159.128.234 162.159.128.235 162.159.129.232 162.159.129.233 162.159.129.234 162.159.129.235 162.159.130.232 162.159.130.233 162.159.130.234 162.159.130.235 162.159.131.232 162.159.131.233 162.159.131.234 162.159.131.235 162.159.132.232 162.159.132.233 162.159.132.234 162.159.132.235 162.159.133.232 162.159.133.233 162.159.133.234 162.159.133.235 162.159.134.232 162.159.134.233 162.159.134.234 162.159.134.235 162.159.135.232 162.159.135.233 162.159.135.234 162.159.135.235 162.159.136.232 162.159.136.233 162.159.136.234 162.159.136.235 162.159.137.232 162.159.137.233 162.159.137.234 162.159.137.235 162.159.138.232 162.159.138.233 162.159.138.234 162.159.138.235 2606:4700:7::/48
